<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Offline &mdash; Cedar Grove</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f4;color:#1a1a1a;
     display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px 32px;text-align:center;max-width:400px;
      box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid #e5e5e5}
.icon{font-size:64px;margin-bottom:20px}
h1{font-size:22px;margin-bottom:10px;color:#111}
p{font-size:14px;color:#666;line-height:1.6;margin-bottom:20px}
.btn{display:inline-block;padding:11px 24px;background:#1D9E75;color:#fff;
     border-radius:22px;font-size:14px;font-weight:600;text-decoration:none;
     cursor:pointer;border:none}
.btn:hover{background:#0F6E56}
.status{margin-top:16px;font-size:12px;color:#999}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128683;</div>
  <h1>You're offline</h1>
  <p>No internet connection detected. Any orders placed will be saved locally and automatically synced to the database when you're back online.</p>
  <button class="btn" onclick="window.history.back()">Go back</button>
  <p class="status" id="status">Checking connection&hellip;</p>
</div>
<script>
setInterval(function(){
  document.getElementById('status').textContent =
    navigator.onLine ? 'Connection restored! Redirecting…' : 'Still offline…';
  if (navigator.onLine) setTimeout(function(){ window.location.href = '/'; }, 1000);
}, 2000);
</script>
</body>
</html>
