name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy to cedargrove.om-biz.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_HOST: cedargrove.om-biz.com
          FTP_USER: cedargrove@cedargrove.om-biz.com
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 << 'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host   = os.environ['FTP_HOST']
          user   = os.environ['FTP_USER']
          passwd = os.environ['FTP_PASS']

          SKIP       = {'.git', '.github', 'database'}
          SKIP_FILES = {'config/env.php'}

          try:
              ftp = ftplib.FTP()
              ftp.connect(host, 21, timeout=30)
              ftp.login(user, passwd)
              ftp.set_pasv(True)
              print("Logged in OK")

              # List root to find the correct web root
              print("\n=== Root directory listing ===")
              ftp.retrlines('LIST')

              # Try common web root names
              web_root = '/'
              for candidate in ['public_html', 'www', 'htdocs', 'web', 'public']:
                  try:
                      ftp.cwd(candidate)
                      web_root = candidate
                      print(f"\nFound web root: {candidate}")
                      print(f"=== {candidate}/ listing ===")
                      ftp.retrlines('LIST')
                      ftp.cwd('/')
                      break
                  except:
                      pass

              print(f"\n=== Deploying to: {web_root} ===")

              def ensure_dir(ftp, path):
                  try: ftp.mkd(path)
                  except: pass

              def upload_file(ftp, local_path, remote_path):
                  with open(local_path, 'rb') as f:
                      ftp.storbinary(f'STOR {remote_path}', f)
                  print(f"  uploaded: {remote_path}")

              def upload_dir(ftp, local_dir, remote_dir):
                  ensure_dir(ftp, remote_dir)
                  for item in sorted(Path(local_dir).iterdir()):
                      rel = str(item.relative_to('.'))
                      if item.name.startswith('.') or item.name in SKIP:
                          print(f"  skipping: {rel}")
                          continue
                      if rel in SKIP_FILES:
                          print(f"  skipping file: {rel}")
                          continue
                      remote_path = f"{remote_dir.rstrip('/')}/{item.name}"
                      if item.is_dir():
                          upload_dir(ftp, str(item), remote_path)
                      else:
                          upload_file(ftp, str(item), remote_path)

              upload_dir(ftp, '.', web_root)
              ftp.quit()
              print("\nDeploy complete!")

          except ftplib.all_errors as e:
              print(f"FTP ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
