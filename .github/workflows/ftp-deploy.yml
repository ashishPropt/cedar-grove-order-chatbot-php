name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy to cedargrove.om-biz.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_HOST: cedargrove.om-biz.com
          FTP_USER: cedargrove@cedargrove.om-biz.com
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 << 'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host   = os.environ['FTP_HOST']
          user   = os.environ['FTP_USER']
          passwd = os.environ['FTP_PASS']

          # Files and dirs to never upload
          SKIP_DIRS  = {'.git', '.github', 'database'}
          SKIP_FILES = {'config/env.php', '.gitignore', 'README.md'}

          try:
              ftp = ftplib.FTP()
              ftp.connect(host, 21, timeout=30)
              ftp.login(user, passwd)
              ftp.set_pasv(True)
              print("Logged in OK")

              # Detect web root
              web_root = '/'
              for candidate in ['public_html', 'www', 'htdocs', 'web']:
                  try:
                      ftp.cwd(candidate)
                      web_root = candidate
                      ftp.cwd('/')
                      print(f"Web root detected: {web_root}")
                      break
                  except:
                      pass

              def ensure_dir(ftp, path):
                  """Recursively create remote directories."""
                  parts = [p for p in path.replace('\\', '/').split('/') if p]
                  current = ''
                  for part in parts:
                      current = current + '/' + part
                      try:
                          ftp.mkd(current)
                          print(f"  created dir: {current}")
                      except:
                          pass  # already exists

              def upload_file(ftp, local_path, remote_path):
                  with open(local_path, 'rb') as f:
                      ftp.storbinary(f'STOR {remote_path}', f)
                  print(f"  uploaded: {remote_path}")

              def upload_dir(ftp, local_dir, remote_dir):
                  ensure_dir(ftp, remote_dir)
                  for item in sorted(Path(local_dir).iterdir()):
                      # Build relative path from repo root for skip checks
                      try:
                          rel = str(item.relative_to(Path('.')))
                      except:
                          rel = item.name

                      # Skip hidden files/dirs and excluded dirs
                      if item.name.startswith('.'):
                          print(f"  skipping hidden: {rel}")
                          continue
                      if item.is_dir() and item.name in SKIP_DIRS:
                          print(f"  skipping dir: {rel}")
                          continue
                      if item.is_file() and rel in SKIP_FILES:
                          print(f"  skipping file: {rel}")
                          continue

                      remote_path = f"{remote_dir.rstrip('/')}/{item.name}"

                      if item.is_dir():
                          upload_dir(ftp, str(item), remote_path)
                      else:
                          upload_file(ftp, str(item), remote_path)

              print(f"\nStarting full deploy to {web_root}...")
              upload_dir(ftp, '.', web_root)
              ftp.quit()
              print("\nDeploy complete!")

          except ftplib.all_errors as e:
              print(f"FTP ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
