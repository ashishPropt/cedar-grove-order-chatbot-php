name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy to cedargrove.om-biz.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_HOST: cedargrove.om-biz.com
          FTP_USER: cedargrove@cedargrove.om-biz.com
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - << 'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host   = os.environ['FTP_HOST']
          user   = os.environ['FTP_USER']
          passwd = os.environ['FTP_PASS']

          SKIP_DIRS  = {'.git', '.github', 'database'}
          SKIP_FILES = {'config/env.php'}

          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=60)
          ftp.login(user, passwd)
          ftp.set_pasv(True)

          # Find the actual web root by listing and detecting domain folder
          root_items = []
          ftp.retrlines('NLST', root_items.append)
          print('Root items:', root_items)

          # Try to find web root
          REMOTE_BASE = None
          for candidate in ['cedargrove.om-biz.com', 'public_html', 'www', 'htdocs']:
              if candidate in root_items:
                  REMOTE_BASE = candidate
                  print('Found remote base:', REMOTE_BASE)
                  break

          if not REMOTE_BASE:
              # Just use root
              REMOTE_BASE = ''
              print('Using FTP root as base')

          def ensure_dir(ftp, path):
              parts = [p for p in path.replace('\\','/').split('/') if p]
              cur = ''
              for p in parts:
                  cur += '/' + p
                  try:
                      ftp.mkd(cur)
                      print('  mkdir:', cur)
                  except:
                      pass  # already exists

          def upload_file(ftp, local, remote):
              # Ensure parent dir exists
              parent = '/'.join(remote.split('/')[:-1])
              if parent:
                  ensure_dir(ftp, parent)
              with open(local, 'rb') as f:
                  ftp.storbinary('STOR ' + remote, f)
              print('  uploaded:', remote)

          def upload_dir(ftp, local_dir, remote_dir):
              ensure_dir(ftp, remote_dir)
              for item in sorted(Path(local_dir).iterdir()):
                  if item.name.startswith('.'): continue
                  if item.is_dir() and item.name in SKIP_DIRS: continue
                  rel = str(item.relative_to(Path('.')))
                  if item.is_file() and rel in SKIP_FILES: continue
                  rpath = remote_dir.rstrip('/') + '/' + item.name
                  if item.is_dir():
                      upload_dir(ftp, str(item), rpath)
                  else:
                      upload_file(ftp, str(item), rpath)

          base = (REMOTE_BASE + '/') if REMOTE_BASE else ''

          # Upload public/* to web root
          print('\n--- Uploading public/ to', base, '---')
          for item in sorted(Path('public').iterdir()):
              if item.name.startswith('.'): continue
              rpath = base + item.name
              if item.is_dir():
                  upload_dir(ftp, str(item), rpath)
              else:
                  upload_file(ftp, str(item), rpath)

          # Upload src/
          print('\n--- Uploading src/ ---')
          upload_dir(ftp, 'src', base + 'src')

          # Upload config/ (skip env.php)
          print('\n--- Uploading config/ ---')
          ensure_dir(ftp, base + 'config')
          for item in sorted(Path('config').iterdir()):
              if item.name == 'env.php':
                  print('  skipping env.php')
                  continue
              upload_file(ftp, str(item), base + 'config/' + item.name)

          ftp.quit()
          print('\nDeploy complete!')
          PYEOF
