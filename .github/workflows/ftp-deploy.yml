name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy to cedargrove.om-biz.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_HOST: cedargrove.om-biz.com
          FTP_USER: cedargrove@cedargrove.om-biz.com
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 << 'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host   = os.environ['FTP_HOST']
          user   = os.environ['FTP_USER']
          passwd = os.environ['FTP_PASS']

          # What goes where:
          # repo/public/*  -> web_root/          (publicly accessible)
          # repo/src/*     -> web_root/../src/   (above web root)
          # repo/config/*  -> web_root/../config/ (above web root, never public)
          # repo/api/*     -> web_root/../api/   (above web root)
          # everything else -> skip

          SKIP_FILES = {'config/env.php'}

          try:
              ftp = ftplib.FTP()
              ftp.connect(host, 21, timeout=30)
              ftp.login(user, passwd)
              ftp.set_pasv(True)
              print("Logged in OK")

              # Detect web root
              web_root = '/'
              for candidate in ['public_html', 'www', 'htdocs', 'web']:
                  try:
                      ftp.cwd(candidate)
                      web_root = '/' + candidate
                      ftp.cwd('/')
                      print(f"Web root detected: {web_root}")
                      break
                  except:
                      pass

              # For this host the structure is:
              # /public_html/cedargrove.om-biz.com/ = web root
              # We need to find cedargrove.om-biz.com subfolder
              try:
                  ftp.cwd(web_root)
                  dirs = []
                  ftp.retrlines('NLST', dirs.append)
                  if 'cedargrove.om-biz.com' in dirs:
                      web_root = web_root + '/cedargrove.om-biz.com'
                      print(f"Domain subfolder found: {web_root}")
                  ftp.cwd('/')
              except:
                  pass

              base_root = web_root  # e.g. /public_html/cedargrove.om-biz.com

              def ensure_dir(ftp, path):
                  parts = [p for p in path.split('/') if p]
                  current = ''
                  for part in parts:
                      current += '/' + part
                      try: ftp.mkd(current)
                      except: pass

              def upload_file(ftp, local_path, remote_path):
                  with open(local_path, 'rb') as f:
                      ftp.storbinary(f'STOR {remote_path}', f)
                  print(f"  uploaded: {remote_path}")

              def upload_dir(ftp, local_dir, remote_dir, skip_files=set()):
                  ensure_dir(ftp, remote_dir)
                  for item in sorted(Path(local_dir).iterdir()):
                      if item.name.startswith('.'):
                          continue
                      rel = str(item.relative_to(Path(local_dir).parent))
                      if rel in skip_files:
                          print(f"  skipping: {rel}")
                          continue
                      remote_path = f"{remote_dir.rstrip('/')}/{item.name}"
                      if item.is_dir():
                          upload_dir(ftp, str(item), remote_path, skip_files)
                      else:
                          upload_file(ftp, str(item), remote_path)

              # 1. Deploy public/* -> web root (what browsers see)
              print(f"\n--- Uploading public/ -> {base_root}/ ---")
              upload_dir(ftp, 'public', base_root)

              # 2. Deploy src/ -> one level above web root
              print(f"\n--- Uploading src/ -> {base_root}/../src/ ---")
              upload_dir(ftp, 'src', base_root + '/../src')

              # 3. Deploy config/ -> one level above web root (skip env.php)
              print(f"\n--- Uploading config/ -> {base_root}/../config/ ---")
              upload_dir(ftp, 'config', base_root + '/../config',
                         skip_files={'config/env.php', 'env.php'})

              # 4. Deploy api/ -> one level above web root
              print(f"\n--- Uploading api/ -> {base_root}/../api/ ---")
              upload_dir(ftp, 'api', base_root + '/../api')

              ftp.quit()
              print("\nDeploy complete!")
              print(f"Site live at: http://cedargrove.om-biz.com/")

          except ftplib.all_errors as e:
              print(f"FTP ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
