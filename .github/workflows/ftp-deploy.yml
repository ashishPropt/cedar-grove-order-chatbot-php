name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy to cedargrove.om-biz.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_HOST: cedargrove.om-biz.com
          FTP_USER: cedargrove@cedargrove.om-biz.com
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - << 'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host   = os.environ['FTP_HOST']
          user   = os.environ['FTP_USER']
          passwd = os.environ['FTP_PASS']

          SKIP_DIRS  = {'.git', '.github', 'database'}
          SKIP_FILES = {'config/env.php'}

          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=60)
          ftp.login(user, passwd)
          ftp.set_pasv(True)

          print('Initial PWD:', ftp.pwd())

          # List root
          items = []
          ftp.retrlines('NLST', items.append)
          print('Root items:', items)

          # Navigate into public_html first (we know from debug.php the path is
          # /home/mathuras/public_html/cedargrove.om-biz.com)
          if 'public_html' in items:
              ftp.cwd('public_html')
              print('Changed to public_html, PWD:', ftp.pwd())
          
          # Now list to find cedargrove.om-biz.com
          items2 = []
          ftp.retrlines('NLST', items2.append)
          print('public_html items:', items2)

          if 'cedargrove.om-biz.com' in items2:
              ftp.cwd('cedargrove.om-biz.com')
              print('Changed to cedargrove.om-biz.com, PWD:', ftp.pwd())
          
          print('Final PWD (web root):', ftp.pwd())

          def ensure_dir(ftp, path):
              """Create directory relative to current directory."""
              parts = [p for p in path.replace('\\', '/').split('/') if p]
              for i, part in enumerate(parts):
                  sub = '/'.join(parts[:i+1])
                  try:
                      ftp.mkd(sub)
                      print('  mkdir:', sub)
                  except:
                      pass

          def upload_file(ftp, local, remote):
              """Upload file, ensuring parent dir exists. remote is relative to cwd."""
              parts = remote.replace('\\', '/').split('/')
              if len(parts) > 1:
                  ensure_dir(ftp, '/'.join(parts[:-1]))
              with open(local, 'rb') as f:
                  ftp.storbinary('STOR ' + remote, f)
              print('  uploaded:', remote)

          def upload_dir(ftp, local_dir, remote_dir):
              """Upload directory recursively. remote_dir is relative to cwd."""
              ensure_dir(ftp, remote_dir)
              for item in sorted(Path(local_dir).iterdir()):
                  if item.name.startswith('.'): continue
                  if item.is_dir() and item.name in SKIP_DIRS: continue
                  rel = str(item.relative_to(Path('.')))
                  if item.is_file() and rel in SKIP_FILES: continue
                  rpath = remote_dir + '/' + item.name
                  if item.is_dir():
                      upload_dir(ftp, str(item), rpath)
                  else:
                      upload_file(ftp, str(item), rpath)

          # Now upload relative to web root (cedargrove.om-biz.com/)
          # public/* goes directly into web root
          print('\n--- Uploading public/ contents to web root ---')
          for item in sorted(Path('public').iterdir()):
              if item.name.startswith('.'): continue
              if item.is_dir():
                  upload_dir(ftp, str(item), item.name)
              else:
                  upload_file(ftp, str(item), item.name)

          # src/ goes into web root/src/
          print('\n--- Uploading src/ ---')
          upload_dir(ftp, 'src', 'src')

          # config/ goes into web root/config/ (skip env.php)
          print('\n--- Uploading config/ ---')
          ensure_dir(ftp, 'config')
          for item in sorted(Path('config').iterdir()):
              if item.name == 'env.php':
                  print('  skipping env.php')
                  continue
              upload_file(ftp, str(item), 'config/' + item.name)

          ftp.quit()
          print('\nDeploy complete!')
          PYEOF
